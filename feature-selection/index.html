<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selection Feature Component</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="page-wrapper">
      <h1>Feature Selection</h1>
      <p class="subtitle">Customize your workspace by picking the features that power your workflow.</p>

      <div class="feature-card-container">
        <label class="feature-card">
          <input type="checkbox" />
          <span class="card-icon">☁️</span>
          <h4>Cloud Storage Expansion</h4>
          <p>Unlock 100 GB of ultra-fast and secure cloud backup for your assets.</p>
        </label>

        <label class="feature-card">
          <input type="checkbox" />
          <span class="card-icon">⚡</span>
          <h4>Dedicated Support</h4>
          <p>Get priority response times with our 24/7 dedicated helper queue.</p>
        </label>

        <label class="feature-card">
          <input type="checkbox" />
          <span class="card-icon">📈</span>
          <h4>Advanced Analytics</h4>
          <p>Deep-dive metrics, custom dashboards, and automated report building.</p>
        </label>

        <label class="feature-card">
          <input type="checkbox" />
          <span class="card-icon">🎨</span>
          <h4>Custom Enterprise Themes</h4>
          <p>Tailor your layout with specialized corporate colors and configurations.</p>
        </label>

        <label class="feature-card">
          <input type="checkbox" />
          <span class="card-icon">👥</span>
          <h4>Multi-User Collaboration</h4>
          <p>Invite team members to edit, share, and comment in real-time.</p>
        </label>

        <label class="feature-card">
          <input type="checkbox" />
          <span class="card-icon">🔧</span>
          <h4>Developer API Access</h4>
          <p>Integrate third-party software workflows into our internal system seamlessly.</p>
        </label>
      </div>
    </main>
  </body>
</html>
