<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="blog-post-card">
      <img src="./img/cover-photo.jpg" alt="Blog Post Image" class="post-img" />

      <div class="post-content">
        <h2 class="post-title">Mastering Modern CSS Layouts</h2>
        <p class="post-excerpt">
          Dive deep into Flexbox and Grid systems to build stunning, responsive interfaces that look beautiful on
          screens of every size.
        </p>
        <a href="#" class="read-more">Read More</a>
      </div>
    </div>
  </body>
</html>
